<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Matrix Search - Unread</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #15171b;
    --panel: #1e2027;
    --border: #2e3038;
    --text: #e3e3e8;
    --muted: #9092a0;
    --accent: #0dbd8b;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  header {
    padding: 24px 16px 12px;
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { font-size: 1.3rem; margin: 0; }
  header a, button.link { color: var(--accent); text-decoration: none; font-size: 0.85rem; background: none; border: none; cursor: pointer; padding: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 16px 40px; }
  .empty, .denied { color: var(--muted); padding: 60px 20px; text-align: center; }
  .columns { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 800px) {
    .columns { grid-template-columns: 1fr; }
  }
  .column h2 {
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  .column-empty { color: var(--muted); font-size: 0.85rem; padding: 8px 2px; }
  .conversation-list { display: flex; flex-direction: column; gap: 8px; }
  .conversation-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    text-decoration: none;
    color: var(--text);
    background: var(--panel);
  }
  .conversation-item:hover { border-color: var(--accent); }
  .conv-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--bg);
  }
  .conv-avatar-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 600;
    color: #04211a;
    background: var(--accent);
  }
  .conv-text { min-width: 0; flex: 1; }
  .conv-name { font-size: 0.9rem; font-weight: 600; display: block; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-preview { font-size: 0.8rem; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { font-size: 0.72rem; color: var(--muted); display: block; margin-top: 4px; }
  .conv-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; white-space: nowrap; }
  .pill.count { background: #0dbd8b33; color: var(--accent); }
  .pill.highlight { background: #ff6b6b33; color: var(--danger); }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Unread</h1>
  <div>
    <button class="link" id="refreshBtn">Refresh</button>
    &middot;
    <a href="/">&larr; Back to search</a>
  </div>
</header>

<main>
  <div id="denied" class="denied" hidden>Please sign in first.</div>
  <div id="locked" class="denied" hidden>Your vault is locked - <a href="/">unlock it</a> to see unread conversations.</div>
  <div id="empty" class="empty" hidden>No unread conversations - you're all caught up.</div>
  <div id="columns" class="columns" hidden>
    <div class="column">
      <h2>Unread PMs</h2>
      <div id="listDirect" class="conversation-list"></div>
    </div>
    <div class="column">
      <h2>Unread Rooms</h2>
      <div id="listRooms" class="conversation-list"></div>
    </div>
  </div>
</main>

<script>
function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function avatarInitial(name) {
  const trimmed = (name || '').trim();
  return trimmed ? trimmed.charAt(0).toUpperCase() : '?';
}

function renderColumn(el, items, emptyLabel) {
  if (!items.length) {
    el.innerHTML = `<div class="column-empty">${emptyLabel}</div>`;
    return;
  }
  el.innerHTML = items.map(item => {
    const date = item.origin_server_ts ? new Date(item.origin_server_ts).toLocaleString() : '';
    const preview = item.sender ? `${escapeHtml(item.sender)}: ${escapeHtml(item.body || '')}` : escapeHtml(item.body || '');
    const initial = escapeHtml(avatarInitial(item.room_name));
    const fallback = `<span class="conv-avatar conv-avatar-fallback"${item.avatar_url ? ' style="display:none;"' : ''}>${initial}</span>`;
    const avatar = item.avatar_url
      ? `<img class="conv-avatar" src="${escapeHtml(item.avatar_url)}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">${fallback}`
      : fallback;
    const badges = `
      <span class="conv-badges">
        ${item.highlight_count > 0 ? `<span class="pill highlight">${item.highlight_count} mention${item.highlight_count === 1 ? '' : 's'}</span>` : ''}
        <span class="pill count">${item.notification_count} unread</span>
      </span>`;
    return `<a class="conversation-item" href="${item.element_url}" target="_blank" rel="noopener">
      ${avatar}
      <span class="conv-text">
        <span class="conv-name">${escapeHtml(item.room_name)}</span>
        <span class="conv-preview">${preview}</span>
        <span class="conv-time">${date}</span>
      </span>
      ${badges}
    </a>`;
  }).join('');
}

async function loadUnread() {
  try {
    const r = await fetch('/api/unread');
    if (r.status === 401) { document.getElementById('denied').hidden = false; return; }
    if (r.status === 423) { document.getElementById('locked').hidden = false; return; }
    if (!r.ok) return;
    const j = await r.json();
    const columnsEl = document.getElementById('columns');
    const emptyEl = document.getElementById('empty');
    if (!j.unread.length) {
      columnsEl.hidden = true;
      emptyEl.hidden = false;
      return;
    }
    emptyEl.hidden = true;
    columnsEl.hidden = false;
    const direct = j.unread.filter(item => item.is_direct);
    const rooms = j.unread.filter(item => !item.is_direct);
    renderColumn(document.getElementById('listDirect'), direct, 'No unread PMs.');
    renderColumn(document.getElementById('listRooms'), rooms, 'No unread rooms.');
  } catch (e) {
    // leave whatever was last rendered rather than clearing it on a blip
  }
}

document.getElementById('refreshBtn').addEventListener('click', loadUnread);

loadUnread();
setInterval(loadUnread, 20000);
</script>
</body>
</html>
