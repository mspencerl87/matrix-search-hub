name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends build-essential libolm-dev

      - name: Install test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Run tests with coverage
        env:
          MATRIX_HOMESERVER: https://matrix.example.test
          BASE_URL: https://search.example.test
          SESSION_SECRET: test-only-session-secret
        run: python -m pytest
